name: Build & Test

# ENG-P0-1 / 评审08类-1（CI 策略）：建立 CI，触发门禁链
#   compile + Checkstyle(validate) + SpotBugs/PMD(verify) + 单测 + failsafe Cucumber IT + OSV CVE 门禁 + Serenity 汇总报告。
# 二期升级：主门禁用 `mvn -B verify`（含 SpotBugs/CVE/汇总报告），Cucumber IT 默认 skip（CI 无 SIT 凭据），
# 另起 `e2e` job 跑真实浏览器 IT，凭据经 Repository Secrets 映射为环境变量。
# 三期升级（2026-09-20）：`e2e` job 已**转正**——移除 continue-on-error，真实浏览器 IT 失败即视为失败。
# 代码部分已完成（CI-E2E，2026-09-20）：`e2e` job 的 `if` 已放开到 pull_request，PR 合并前即跑真实浏览器 IT。
# ⚠️ 仍需人工完成的仓库设置（代码改不了）：Settings → Branches → 分支保护规则，将本 workflow 设为 required status check；
#    否则 PR 虽会跑 E2E，但合并并不强制要求它通过。前提：PII/SIT 凭据以 Repository Secrets 对 PR 可用
#    （同仓库 PR 默认可用；fork PR 不可用，需另行评估），且接受每个 PR 都跑真实浏览器 IT 的时长成本。
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install Playwright browsers (for e2e job cache & local)
        run: mvn -B -q -DskipTests exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      - name: Build and verify (gates: compile + Checkstyle + SpotBugs + unit + CVE + summary report)
        # -DskipITs：主门禁不依赖 SIT 凭据/浏览器环境；真实 IT 见下方 e2e job。
        # -Psca：A-2 治理——激活 SCA profile，在 package 阶段 install 兄弟模块到 .m2（供 OSV-Scanner
        #        解析 intra-project 兄弟模块），并在 verify 阶段跑 CVE 门禁；普通本地构建不加 -Psca 则不污染 .m2。
        run: mvn -B verify -Psca -DskipITs -Dtags='not @skip'

      - name: Checkstyle baseline gate (只减不增, A-1)
        # verify 已产出各模块 target/checkstyle-result.xml；当前 <error> 总数不得超过根 checkstyle-baseline.xml。
        # maven-checkstyle-plugin:3.6.0 的 check 目标不支持 <baseline>，故以 CI 计数比对实现祖父化（存量 1325 条）。
        run: |
          BASE=$(grep -c '<error' checkstyle-baseline.xml)
          CUR=0
          while IFS= read -r f; do
            n=$(grep -c '<error' "$f"); CUR=$((CUR + n))
          done < <(find . -path '*/target/checkstyle-result.xml')
          echo "Checkstyle violations: current=$CUR baseline=$BASE"
          if [ "$CUR" -gt "$BASE" ]; then
            echo "::error::Checkstyle 违规数增加（$CUR > $BASE），请修复新增违规或同步缩减基线（checkstyle-baseline.xml）"
            exit 1
          fi

      - name: Install OSV-Scanner (CVE gate)
        run: curl -sSfL https://raw.githubusercontent.com/google/osv-scanner/main/install.sh | sh -s -- -b /usr/local/bin

      - name: CVE gate (OSV)
        env:
          OSV_CVE_GATE_REQUIRED: "true"
        run: pwsh tools/cve-gate.ps1

      - name: Upload Serenity reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serenity-reports
          path: '**/target/site/serenity/**'
          if-no-files-found: error

  e2e:
    # 转正（2026-09-20，CI-E2E 修复）：移除 continue-on-error —— 真实浏览器 IT 失败如实报红；
    # 并已把 `if` 放开到 pull_request（见下），使 PR 合并前即跑真实浏览器 IT（需 SIT 凭据对 PR 可用）。
    # 剩余仓库设置（代码改不了）：Settings → Branches → 分支保护规则，将本 workflow 设为 required status check。
    needs: build
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      # 凭据经 Repository Secrets 注入（绝不入库）；本地用 export 同名变量。
      DBB_TEST_PASSWORD: ${{ secrets.DBB_TEST_PASSWORD }}
      DBB_OTP_URL_O63: ${{ secrets.DBB_OTP_URL_O63 }}
      DBB_OTP_URL_O38: ${{ secrets.DBB_OTP_URL_O38 }}
      DBB_OTP_URL_O88: ${{ secrets.DBB_OTP_URL_O88 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install Playwright browsers
        run: mvn -B -q -DskipTests exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      - name: Run self-contained browser E2E (headless Playwright chromium, no external service)
        # F-05 修复（2026-09-21）：原命令 `mvn -B verify -Dtags='not @skip'` 结构性必红，三重叠加：
        #   ① CI runner 无显示器，而 serenity.conf 默认 headless:false → 显式 -Dplaywright.browser.headless=true；
        #   ② CI 只安装 Playwright 下载的 chromium，而 serenity.conf 默认 channel:"chrome"
        #      → 显式清空 -Dplaywright.browser.channel=（空值 = 使用 Playwright 自带 chromium）；
        #   ③ 原标签 not @skip 会连带依赖 localhost:8888/8899 的 route(82)/api(11) 场景，而 CI 从不启动
        #      route-demo-service/web → 本 job 收敛为「自包含」标签（本地 HTML，零外部依赖）。
        #   决策（P0-5 ③）：route-demo 演示服务本期不纳入 CI（避免为演示服务引入容器/常驻进程的脆弱性）；
        #      需要跑那 93 条场景时，在可达 8888/8899 的机器上执行：
        #        mvn -f route-demo-service/pom.xml spring-boot:run            # 8888（另一终端）
        #        mvn -B -pl test-automation -am verify -Dtags='@route or @api' -Dplaywright.browser.headless=true
        run: mvn -B verify -Dtags='( @e2e-sandbox or @picker ) and not @skip' -Dplaywright.browser.headless=true -Dplaywright.browser.channel=
