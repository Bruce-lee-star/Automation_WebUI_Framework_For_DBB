# DBB Automation Framework — 密钥/明文凭据扫描配置
# 用法：gitleaks detect --source . --config .gitleaks.toml
# 目的：拦截明文密码 / 密钥 / token 入库。
#
# 设计说明：
# - useDefault 提供通用 API Key / 令牌检测，覆盖 .java、browserstack.conf 等源码与配置。
# - 自定义规则 dbb-plaintext-secret 针对本框架配置中的
#   password/client_secret/api_key/access_key/private_key/secret 赋值做兜底检测，
#   允许 ENC(...) 密文（T0-2 透明解密方案），从而兼容"密文入库、主密钥外置"的设计；
#   同时放行明显占位符（your_access_key / mypass / testpass / special-key / dev-token 等），避免误报。
# - serenity.conf 整体豁免：其敏感数据由配置所有者自行加密后放入该文件（框架不触碰、不扫描其内容），
#   故直接从扫描范围排除，仅依赖 owner 侧的加密与权限管控。

title = "DBB Automation Framework"

[extend]
useDefault = true

[rules]
  [rules.dbb-plaintext-secret]
  id = "dbb-plaintext-secret"
  description = "DBB: 明文密钥/口令不得入库（ENC(...) 密文除外）"
  regex = '''(?i)(?:password|client[_-]?secret|api[_-]?key|access[_-]?key|private[_-]?key|secret)\s*[:=]\s*["']?[^"'$,{}\s]{2,}'''
  # 放行：ENC(...) 密文、明显占位符、测试夹具假 token
  allowlist = { regexes = [
    '''ENC\([^)]*\)''',
    '''(?i)your[_-]?access[_-]?key''',
    '''(?i)yourpassword''',
    '''(?i)mypass''',
    '''(?i)testpass''',
    '''(?i)special[_-]?key''',
    '''(?i)dev[_-]?token''',
    '''(?i)test[_-]?token''',
    '''secretToken123''',
  ] }

[allowlist]
description = "排除构建产物、文档，以及 serenity.conf 测试配置"
paths = [
  ".*/target/.*",
  ".*/build/.*",
  ".*/\\.git/.*",
  ".*serenity.conf$",
  ".*\\.md$",
]
