<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 1.5rem;">
  <div style="background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 1rem;">
    <p style="font-size: 13px; color: var(--color-text-secondary); margin: 0 0 4px;">综合成熟度</p>
    <p style="font-size: 24px; font-weight: 500; margin: 0; color: #A32D2D;">3.5 / 10</p>
  </div>
  <div style="background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 1rem;">
    <p style="font-size: 13px; color: var(--color-text-secondary); margin: 0 0 4px;">主代码规模</p>
    <p style="font-size: 24px; font-weight: 500; margin: 0;">50,853 行</p>
  </div>
  <div style="background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 1rem;">
    <p style="font-size: 13px; color: var(--color-text-secondary); margin: 0 0 4px;">单元测试数</p>
    <p style="font-size: 24px; font-weight: 500; margin: 0; color: #A32D2D;">71 个</p>
  </div>
  <div style="background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 1rem;">

<div style="display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 12px; font-size: 12px; color: var(--color-text-secondary);">
  <span style="display: flex; align-items: center; gap: 4px;">
    <span style="width: 10px; height: 10px; border-radius: 2px; background: #E24B4A;"></span>不达标 (≤3)
  </span>
  <span style="display: flex; align-items: center; gap: 4px;">
    <span style="width: 10px; height: 10px; border-radius: 2px; background: #EF9F27;"></span>待改进 (4-6)
  </span>

<div style="position: relative; width: 100%; height: 560px;">
  <canvas id="archScore" role="img" aria-label="横向条形图，展示 12 个架构维度评分：模块化与边界 2 分、抽象与可替换性 2 分、并发与扩展性 2 分、可测试性 2 分、工程规范与门禁 2 分、错误处理 3 分、安全与合规 4 分、配置管理 4 分、可观测性与报告 6 分、文档 6 分、技术选型 8 分、功能完备度 8 分">12 个架构维度评分，最低 2 分（模块化、抽象、并发、可测试性、工程门禁），最高 8 分（技术选型、功能完备度）。</canvas>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
(function(){
  var labels = ['模块化与边界','抽象与可替换性','并发与扩展性','可测试性','工程规范与门禁','错误处理','安全与合规','配置管理','可观测性与报告','文档','技术选型','功能完备度'];
  var data = [2,2,2,2,2,3,4,4,6,6,8,8];
  var colors = data.map(function(v){ return v <= 3 ? '#E24B4A' : (v <= 6 ? '#EF9F27' : '#639922'); });
  new Chart(document.getElementById('archScore'), {
    type: 'bar',
    data: { labels: labels, datasets: [{ label: '评分', data: data, backgroundColor: colors, borderRadius: 4, barPercentage: 0.7 }] },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: function(c){ return c.parsed.x + ' / 10'; } } }
      },
      scales: {
        x: { min: 0, max: 10, ticks: { stepSize: 2, color: '#5F5E5A', font: { size: 12 } }, grid: { color: 'rgba(0,0,0,0.06)' }, title: { display: true, text: '成熟度评分（满分 10）', color: '#5F5E5A', font: { size: 12 } } },
        y: { ticks: { autoSkip: false, color: '#2C2C2A', font: { size: 12 } }, grid: { display: false } }
      }
    }
  });
})();
</script>
