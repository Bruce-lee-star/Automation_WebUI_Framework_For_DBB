<svg viewBox="0 0 680 470" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>框架分层结构与 3 处依赖方向违规</title>
<desc>四个分层从上到下为 page 页面层、route 能力层、lifecycle 生命周期层、core 核心状态层。正常依赖向下，但存在 3 条向上的违规依赖：lifecycle 反向依赖 page、lifecycle 反向依赖 route、core 反向依赖 lifecycle，构成两组循环依赖。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<g class="c-blue">
  <rect x="240" y="40" width="200" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="60" text-anchor="middle" dominant-baseline="central">page 页面层</text>
  <text class="ts" x="340" y="78" text-anchor="middle" dominant-baseline="central">BasePage 1801 行</text>
</g>

<g class="c-purple">
  <rect x="240" y="136" width="200" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="156" text-anchor="middle" dominant-baseline="central">route 能力层</text>
  <text class="ts" x="340" y="174" text-anchor="middle" dominant-baseline="central">14799 行，占 29%</text>
</g>

<g class="c-amber">
  <rect x="240" y="232" width="200" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="252" text-anchor="middle" dominant-baseline="central">lifecycle 生命周期层</text>
  <text class="ts" x="340" y="270" text-anchor="middle" dominant-baseline="central">PlaywrightManager</text>
</g>

<g class="c-gray">
  <rect x="240" y="328" width="200" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="348" text-anchor="middle" dominant-baseline="central">core 核心状态层</text>
  <text class="ts" x="340" y="366" text-anchor="middle" dominant-baseline="central">FrameworkState</text>
</g>

<path d="M240 68 H200 V260 H234" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="194" y="160" text-anchor="end" dominant-baseline="central">正常</text>
<text class="ts" x="194" y="176" text-anchor="end" dominant-baseline="central">BasePage:8</text>

<path d="M240 276 H160 V356 H234" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="154" y="320" text-anchor="end" dominant-baseline="central">正常</text>

<path d="M440 244 H520 V68 H446" fill="none" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="528" y="150" dominant-baseline="central" fill="#A32D2D">违规 1</text>
<text class="ts" x="528" y="166" dominant-baseline="central" fill="#A32D2D">Manager:12,13</text>

<path d="M440 262 H480 V164 H446" fill="none" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="488" y="206" dominant-baseline="central" fill="#A32D2D">违规 2</text>
<text class="ts" x="488" y="222" dominant-baseline="central" fill="#A32D2D">Manager:10,11</text>

<path d="M440 356 H580 V276 H446" fill="none" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="588" y="308" dominant-baseline="central" fill="#A32D2D">违规 3</text>
<text class="ts" x="588" y="324" dominant-baseline="central" fill="#A32D2D">Core:4</text>

<line x1="40" y1="412" x2="640" y2="412" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
<line x1="40" y1="432" x2="70" y2="432" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<text class="ts" x="78" y="432" dominant-baseline="central">向下依赖（正常）</text>
<line x1="230" y1="432" x2="260" y2="432" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<text class="ts" x="268" y="432" dominant-baseline="central" fill="#A32D2D">向上依赖（违规）：形成 page ⇄ lifecycle 与 core ⇄ lifecycle 两组循环</text>
</svg>
