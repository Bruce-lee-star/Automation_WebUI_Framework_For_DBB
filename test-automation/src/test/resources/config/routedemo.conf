# ============================================================
# Route Demo Service - API 实体配置（RestAssured 框架）
# 对应 src/test/resources/features/api 下的 route-demo API 测试。
# 运行前请先启动 demo 服务：
#   cd route-demo-service && mvn spring-boot:run
# （默认监听 http://localhost:8888/demo）
# ============================================================

# 全局默认 Headers（JSON 接口；entity 级覆盖 application.conf）
headers {
    Accept = "application/json"
    Content-Type = "application/json"
}

# API Base URI（多环境可在此追加 dev/test/prod 节点覆盖 default）
api.base.uri {
    default = "http://localhost:8888/demo"
}
