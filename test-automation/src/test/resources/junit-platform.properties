# =============================================================================
# CON-1 引擎级并行接线（评审 X-1 / W-5）
# -----------------------------------------------------------------------------
# 默认：套件<b>严格串行</b>。仅在显式 -Pparallel（见 test-automation/pom.xml 的
# parallel profile）时，由 failsafe 注入 cucumber.execution.parallel.enabled=true
# 才开启引擎级并行；稳定两周 nightly 后再评估转为默认。
#
# 设计铁律（docs/architecture-review/10_并发执行与用例隔离.md §5.1）：
#   - 进程内线程并行（forkCount 保持 1），不启多 JVM，避免 Serenity 聚合复杂化。
#   - 隔离以 scenario 为最小单元，同 feature 内 scenario 可并行；
#     跨 feature 并行由并行度（线程池）决定。
#   - 不可并行的用例打 @isolated 标签独占 resource:global（等价于串行）。
#   - 并发度/线程池上限由 parallel profile 经系统属性注入，可 -Dparallelism=N
#     -DmaxPoolSize=M 在 CI 上调参（梯度 4 → 8 → 16 压测，见 X-1）。
#
# 注意：cucumber.plugin 已由各 Cucumber *IT Runner 的 @ConfigurationParameter 统一
# 设为 io.cucumber.core.plugin.SerenityReporterParallel（并行线程安全 reporter），
# 此处不再重复，避免与 Runner 配置优先级冲突。
# =============================================================================

# ---------- 隔离粒度：scenario 为最小并行单元 ----------
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=4
cucumber.execution.parallel.config.fixed.max-pool-size=8

# ---------- @isolated 标签：对无法并行的用例串行保护 ----------
# 打了 @isolated 的 scenario 获取 resource:global 的读-写锁 → 独占执行（等价于串行），
# 既享受并行收益，又保护少数「Must be serial」的用例（改全局配置 / 清理共享数据 / OTP 限流）。
# 注意：resource 名必须与标签名一致（Cucumber 将 @isolated 映射为 resource 名 isolated）。
cucumber.execution.exclusive-resources.isolated.read-write=resource:global
