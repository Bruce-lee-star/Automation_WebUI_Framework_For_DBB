<!doctype html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <title>Picker StepGen Test</title>
</head>
<body>
    <h1>步骤生成综合测试页</h1>

    <!-- 普通按钮 -->
    <button id="btn-submit">提交</button>

    <!-- 文本框（fill） -->
    <input id="input-name" type="text" placeholder="姓名">

    <!-- 复选框（setChecked） -->
    <label><input id="cb" type="checkbox"> 同意条款</label>

    <!-- 单选（check） -->
    <label><input id="radio-male" type="radio" name="gender"> 男</label>

    <!-- 下拉选择 -->
    <select id="city">
        <option value="bj">北京</option>
        <option value="sh">上海</option>
    </select>

    <!-- 下载链接 -->
    <a id="dl" download="sample.txt" href="data:text/plain;charset=utf-8,hello">下载文件</a>

    <!-- 拖拽源/目标 -->
    <div id="dragSrc" style="width:60px;height:60px;background:#cce;display:inline-block">拖拽源</div>
    <div id="dragDst" style="width:60px;height:60px;background:#eec;display:inline-block;margin-left:20px">拖拽目标</div>

    <!-- 触发 alert 的按钮 -->
    <button id="btn-alert" onclick="alert('hello alert')">触发Alert</button>

    <!-- 触发 confirm 的按钮 -->
    <button id="btn-confirm" onclick="confirm('确定吗')">触发Confirm</button>

    <!-- 打开新页面的按钮 -->
    <button id="popBtn" onclick="window.open('about:blank','_blank')">打开新页面</button>

    <!-- 嵌套 iframe（用于验证 frame 切换） -->
    <iframe id="frame1" name="frame1" src="picker-iframe-child.html" style="width:320px;height:160px;border:1px solid #999"></iframe>

    <!-- open shadow root（用于验证 shadow 穿透） -->
    <div id="shadow-host"></div>
    <script>
        const host = document.getElementById('shadow-host');
        const sr = host.attachShadow({ mode: 'open' });
        const btn = document.createElement('button');
        btn.id = 'shadow-btn';
        btn.textContent = 'Shadow按钮';
        sr.appendChild(btn);
    </script>
</body>
</html>
